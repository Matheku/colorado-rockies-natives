# Treeline — static site server block.
# Install to /etc/nginx/sites-available/treeline and symlink into sites-enabled.
# __DOMAIN__ is substituted by deploy.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/treeline;
    index index.html;

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # nginx does not merge add_header down into a location that declares its
    # own, so these two are repeated in every block below that sets a header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The HTML must never be held, or a new deploy is never picked up.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets are cache-busted with ?v=N, so they can be held indefinitely.
    location ~* \.(css|js)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
